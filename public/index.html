<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MTSS | Öğrenci Takip Sistemi</title><style>

    :root{
      --bg:#f4f7fb;
      --panel:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#3459d1;
      --primary-soft:#eef2ff;
      --success:#15803d;
      --danger:#b91c1c;
      --shadow:0 12px 30px rgba(15,23,42,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}
    .sidebar{
      background:#111827;
      color:#fff;
      padding:24px 18px;
      position:sticky;
      top:0;
      height:100vh;
    }
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}
    .brand-badge{
      width:42px;height:42px;border-radius:12px;background:#fff;color:#111827;
      display:grid;place-items:center;font-weight:800;
    }
    .brand h1{font-size:15px;margin:0;line-height:1.3}
    .page-footer{text-align:center;color:var(--muted);font-size:13px;padding:28px 0 4px}
    .brand span{font-size:12px;color:#9ca3af}
    .nav{display:grid;gap:8px}
    .nav button{
      width:100%;border:0;background:transparent;color:#d1d5db;
      text-align:left;padding:12px 14px;border-radius:12px;
    }
    .nav button:hover,.nav button.active{background:#1f2937;color:#fff}
    .sidebar-note{
      position:absolute;bottom:18px;left:18px;right:18px;
      padding:14px;border-radius:14px;background:#1f2937;color:#9ca3af;font-size:12px;line-height:1.5;
    }
    .main{padding:30px;min-width:0}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}
    .topbar h2{margin:0;font-size:28px}
    .topbar p{margin:6px 0 0;color:var(--muted)}
    .teacher-pill{background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:999px;font-size:13px}
    .grid{display:grid;gap:18px}
    .class-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .card{
      background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    .class-card{padding:20px;transition:.18s ease;cursor:pointer}
    .class-card:hover{transform:translateY(-2px);border-color:#c7d2fe}
    .class-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .class-icon{width:48px;height:48px;border-radius:14px;background:var(--primary-soft);display:grid;place-items:center;font-size:22px}
    .class-card h3{margin:14px 0 4px;font-size:18px}
    .class-card p{margin:0;color:var(--muted);font-size:14px}
    .count{font-size:12px;background:#f3f4f6;padding:6px 9px;border-radius:999px;color:#374151}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
    .input,.select,.textarea{
      width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--text);outline:none;
    }
    .input:focus,.select:focus,.textarea:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
    .search{max-width:360px}
    .btn{
      border:0;border-radius:12px;padding:11px 15px;font-weight:650;
      background:var(--primary);color:white;
    }
    .btn.secondary{background:white;color:var(--text);border:1px solid var(--line)}
    .btn.success{background:var(--success)}
    .btn.danger{background:var(--danger)}
    .students-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
    .student-card{padding:18px;cursor:pointer}
    .student-card:hover{border-color:#c7d2fe}
    .avatar{
      width:52px;height:52px;border-radius:50%;background:#eef2ff;color:#3730a3;
      display:grid;place-items:center;font-weight:800;font-size:17px;margin-bottom:12px;
    }
    .student-card h4{margin:0 0 4px}
    .student-card small{color:var(--muted)}
    .profile-layout{display:grid;grid-template-columns:320px 1fr;gap:20px}
    .profile-card{padding:22px;height:max-content}
    .profile-avatar{
      width:88px;height:88px;border-radius:24px;background:#eef2ff;color:#3730a3;
      display:grid;place-items:center;font-weight:800;font-size:28px;margin-bottom:18px;
    }
    .meta{display:grid;gap:10px;margin-top:18px}
    .meta-row{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:14px}
    .muted{color:var(--muted)}
    .section{padding:22px}
    .section h3{margin:0 0 16px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-group{display:grid;gap:7px}
    .form-group.full{grid-column:1/-1}
    .form-group label{font-size:13px;font-weight:650}
    .textarea{min-height:130px;resize:vertical}
    .rubric-head{display:grid;gap:16px;margin-bottom:22px}
    .scale-legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
    .scale-item{padding:10px;border-radius:12px;background:var(--primary-soft);font-size:12px;line-height:1.35}
    .scale-item strong{display:block;font-size:17px;color:#3730a3;margin-bottom:3px}
    .rubric-section{display:grid;gap:12px;margin-top:24px}
    .rubric-section>h3{margin:0;padding-bottom:8px;border-bottom:1px solid var(--line)}
    .rubric-item{padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:center}
    .rubric-title{display:flex;gap:10px;align-items:flex-start}
    .rubric-code{background:#111827;color:white;border-radius:9px;padding:5px 7px;font-size:12px;font-weight:800;flex:none}
    .rubric-copy h4{margin:1px 0 6px;font-size:15px}.rubric-copy p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
    .rubric-copy details{margin-top:8px;font-size:12px;color:#4b5563}.rubric-copy summary{cursor:pointer;font-weight:700}
    .rating-options{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
    .rating-option{position:relative;cursor:pointer}.rating-option input{position:absolute;opacity:0;pointer-events:none}
    .rating-option span{height:46px;border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;background:white;font-weight:800;color:#374151}
    .rating-option input:checked+span{background:var(--primary);border-color:var(--primary);color:white;box-shadow:0 0 0 3px rgba(52,89,209,.16)}
    .rating-option input:focus-visible+span{outline:3px solid #818cf8;outline-offset:2px}
    .saved-ratings{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.saved-rating{background:var(--primary-soft);color:#3730a3;border-radius:8px;padding:5px 7px;font-size:12px;font-weight:750}
    .rubric-answer-list{display:grid;gap:9px;margin-top:12px}
    .rubric-answer{padding:12px;border:1px solid var(--line);border-radius:11px;background:white}
    .rubric-answer strong{display:block;font-size:13px;color:#1f2937}
    .rubric-answer p{margin:5px 0!important;color:#4b5563;font-size:13px}
    .rubric-answer span{display:inline-block;color:#3730a3;background:var(--primary-soft);border-radius:8px;padding:5px 8px;font-size:12px}
    .rubric-general-note{margin-top:12px!important;padding:12px;border-radius:11px;background:#fffbeb}
    .evaluation-toggle-list{display:grid;gap:10px}
    .evaluation-toggle{overflow:hidden}
    .evaluation-toggle>summary{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;cursor:pointer;list-style:none}
    .evaluation-toggle>summary::-webkit-details-marker{display:none}
    .evaluation-toggle>summary strong,.evaluation-toggle>summary small{display:block}
    .evaluation-toggle>summary small{margin-top:4px;color:var(--muted)}
    .toggle-label{color:var(--primary);font-size:13px;font-weight:750;white-space:nowrap}
    .toggle-label::after{content:'Yanıtları aç ▾'}
    .evaluation-toggle[open] .toggle-label::after{content:'Yanıtları kapat ▴'}
    .evaluation-toggle[open]>summary{border-bottom:1px solid var(--line);background:#f8fafc}
    .evaluation-toggle-content{padding:0 18px}
    .rubric-record{padding:18px 0;border-bottom:1px solid var(--line)}
    .rubric-record:last-child{border-bottom:0}
    .response-toggle{border:1px solid var(--line);border-radius:14px;background:#fafafa;overflow:hidden}
    .response-toggle>summary{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;cursor:pointer;list-style:none}
    .response-toggle>summary::-webkit-details-marker{display:none}
    .response-toggle>summary strong,.response-toggle>summary small{display:block}
    .response-toggle>summary small{margin-top:4px;color:var(--muted)}
    .response-summary-meta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;white-space:nowrap}
    .response-summary-meta i::after{content:'▾';font-style:normal;color:var(--primary);font-size:16px}
    .response-toggle[open] .response-summary-meta i::after{content:'▴'}
    .response-toggle[open]>summary{border-bottom:1px solid var(--line);background:#f8fafc}
    .response-toggle-content{padding:16px}
    .response-fields{display:grid;gap:12px}
    .response-fields p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
    .response-fields p strong{display:block;margin-bottom:3px;color:#374151;font-size:13px}
    .evaluation-list{display:grid;gap:12px}
    .parent-form-note{margin:-6px 0 16px}
    .evaluation{
      border:1px solid var(--line);border-radius:14px;padding:14px;background:#fafafa;
    }
    .evaluation-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px}
    .evaluation-head strong{font-size:14px}
    .evaluation-head span{font-size:12px;color:var(--muted)}
    .evaluation p{margin:0;line-height:1.55}
    .empty{padding:24px;text-align:center;border:1px dashed #cbd5e1;border-radius:14px;color:var(--muted)}
    .table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}
    table{width:100%;border-collapse:collapse;min-width:900px}
    th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
    th{background:#f8fafc;color:#475569;position:sticky;top:0}
    tr:last-child td{border-bottom:0}
    .stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}
    .stat{padding:18px}
    .stat strong{font-size:27px;display:block;margin-bottom:3px}
    .stat span{color:var(--muted);font-size:13px}
    .back{display:inline-flex;align-items:center;gap:7px;margin-bottom:16px;color:#475569;background:transparent;border:0;padding:0}
    .tracking-layout{grid-template-columns:minmax(340px,460px) minmax(0,1fr);align-items:start}
    .student-check-list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
    .student-check-group{border:0;padding:0 0 12px;margin:0 0 12px;border-bottom:1px solid var(--line)}
    .student-check-group:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
    .student-check-group legend{font-weight:750;font-size:13px;margin-bottom:8px}
    .student-check-group label{display:flex;gap:7px;align-items:center;padding:5px 0;font-size:13px;cursor:pointer}
    .group-picker-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
    .group-picker-grid .form-group{min-width:0}
    .group-picker-grid>.btn{margin-bottom:0;white-space:nowrap}
    .selected-group-students{display:grid;gap:8px;margin-top:12px}
    .selected-group-student{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
    .selected-group-student strong,.selected-group-student small{display:block}
    .selected-group-student small{color:var(--muted);margin-top:3px}
    .selected-group-student .btn{padding:7px 10px;font-size:12px}
    .interview-list{display:grid;gap:10px}
    .interview-row{overflow:hidden}
    .interview-row>summary{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 17px;cursor:pointer;list-style:none}
    .interview-row>summary::-webkit-details-marker{display:none}
    .interview-row>summary strong,.interview-row>summary small{display:block}
    .interview-row>summary small{color:var(--muted);margin-top:4px}
    .interview-summary-meta{text-align:right;white-space:nowrap}
    .interview-row[open]>summary{background:#f8fafc;border-bottom:1px solid var(--line)}
    .interview-row-content{padding:16px;display:grid;gap:12px}
    .interview-row-content p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
    .interview-row-content p strong{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
    .meeting-category{overflow:hidden}
    .meeting-category>summary{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;cursor:pointer;list-style:none}
    .meeting-category>summary::-webkit-details-marker{display:none}
    .meeting-category>summary span{color:var(--primary);font-size:13px;font-weight:750}
    .meeting-category>summary span::after{content:' ▾'}
    .meeting-category[open]>summary{background:#f8fafc;border-bottom:1px solid var(--line)}
    .meeting-category[open]>summary span::after{content:' ▴'}
    .meeting-category-content{padding:16px}
    .profile-meeting-list{display:grid;gap:8px}
    .profile-meeting-head,.profile-meeting-row>summary{display:grid;grid-template-columns:150px minmax(0,1fr) 160px 20px;gap:16px;align-items:center}
    .profile-meeting-head{padding:0 14px 4px;color:var(--muted);font-size:12px;font-weight:750}
    .profile-meeting-row{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
    .profile-meeting-row>summary{padding:13px 14px;cursor:pointer;list-style:none;font-size:13px}
    .profile-meeting-row>summary::-webkit-details-marker{display:none}
    .profile-meeting-row>summary::after{content:'▾';color:var(--primary);font-weight:800;justify-self:end;grid-column:4}
    .profile-meeting-row[open]>summary{background:#f8fafc;border-bottom:1px solid var(--line)}
    .profile-meeting-row[open]>summary::after{content:'▴'}
    .appointment-form{margin-bottom:22px}
    .calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}
    .calendar-toolbar h3{margin:0;text-transform:capitalize}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));border:1px solid var(--line);border-radius:16px;overflow:auto;background:white}
    .calendar-weekday{padding:10px;text-align:center;background:#f8fafc;color:var(--muted);font-size:12px;font-weight:750;border-bottom:1px solid var(--line)}
    .calendar-day{min-height:125px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
    .calendar-day:nth-child(7n){border-right:0}
    .calendar-day.outside{background:#f8fafc}
    .calendar-day.today>b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--primary);color:white}
    .calendar-events{display:grid;gap:5px;margin-top:7px}
    .calendar-event{padding:6px 7px;border-radius:8px;font-size:11px;line-height:1.3;overflow:hidden}
    .calendar-event strong,.calendar-event span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .calendar-event.completed{background:#dcfce7;color:#166534}
    .calendar-event.appointment{background:#dbeafe;color:#1e40af}
    .calendar-legend{display:flex;gap:18px;margin-top:12px;color:var(--muted);font-size:12px}
    .calendar-legend span{display:flex;align-items:center;gap:6px}
    .calendar-legend i{width:12px;height:12px;border-radius:4px}.calendar-legend i.completed{background:#86efac}.calendar-legend i.appointment{background:#93c5fd}
    .toast{
      position:fixed;right:24px;bottom:24px;background:#111827;color:white;
      border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);display:none;z-index:30;
    }
    @media(max-width:1050px){
      .class-grid{grid-template-columns:repeat(2,1fr)}
      .students-grid{grid-template-columns:repeat(3,1fr)}
      .profile-layout{grid-template-columns:1fr}
      .tracking-layout{grid-template-columns:1fr}
      .stats{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:760px){
      .app{grid-template-columns:1fr}
      .sidebar{height:auto;position:relative;padding:16px}
      .sidebar-note{display:none}
      .nav{grid-template-columns:1fr 1fr}
      .main{padding:18px}
      .topbar{align-items:flex-start;flex-direction:column}
      .class-grid,.students-grid,.stats{grid-template-columns:1fr}
      .form-grid{grid-template-columns:1fr}
      .group-picker-grid{grid-template-columns:1fr}
      .scale-legend{grid-template-columns:1fr 1fr}.rubric-item{grid-template-columns:1fr}
      .profile-meeting-head{display:none}
      .profile-meeting-row>summary{grid-template-columns:minmax(0,1fr) 20px;gap:5px 10px}
      .profile-meeting-row>summary>span,.profile-meeting-row>summary>strong{grid-column:1}
      .profile-meeting-row>summary::after{grid-column:2;grid-row:1}
      .calendar-grid{grid-template-columns:repeat(7,minmax(105px,1fr))}
    }
    @media print{
      .sidebar,.topbar,.toolbar,.back,.btn{display:none!important}
      .app{display:block}
      .main{padding:0}
      body{background:white}
      .card,.table-wrap{box-shadow:none;border:0}
    }
  
[hidden]{display:none!important}button:focus-visible{outline:3px solid #818cf8;outline-offset:3px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top left,#dbe5ff,transparent 60%),#f4f7fb}.login-card{width:min(460px,100%);padding:36px}.login-card .brand-badge{background:#3459d1;color:white;margin-bottom:24px}.login-card h1{font-size:26px;margin:0 0 10px}.login-card p{line-height:1.6}.login-card form{display:grid;gap:18px;margin-top:26px}.login-card .btn{width:100%}.login-error{color:#b91c1c;min-height:22px;margin:0}.school-card{width:min(780px,100%);padding:36px}.school-card>h1{margin:0 0 8px}.school-options{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:28px 0 20px}.school-option{text-align:left;font:inherit;color:inherit;padding:26px}.school-option:hover{border-color:var(--primary);transform:translateY(-2px)}.school-option strong{display:block;font-size:18px;line-height:1.4;margin-bottom:8px}.school-option span{color:var(--muted);font-size:14px}.school-actions{display:flex;justify-content:flex-end}.role-box{margin:24px 0;padding:14px;background:#1f2937;border-radius:12px;font-size:14px}.role-box strong{display:block;line-height:1.4}.role-box button{margin-top:12px;width:100%}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{font-size:14px}.tabs button.active{background:#3459d1;color:white;border-color:#3459d1}.profile-content{min-width:0}.meta-row strong{text-align:right;overflow-wrap:anywhere}.evaluation p{white-space:pre-wrap;overflow-wrap:anywhere}.error-banner{padding:16px;background:#fff1f2;color:#991b1b;border-radius:12px;margin-bottom:16px}.class-card,.student-card{text-align:left;font:inherit;color:inherit}.small-note{font-size:13px;line-height:1.6}.section form .btn{justify-self:start}.profile-card h2{font-size:24px}.form-group label{font-size:14px}.section h3{line-height:1.5}.subtabs{margin-bottom:20px}.meeting-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.delete-dialog{border:0;border-radius:18px;box-shadow:var(--shadow);max-width:420px;padding:28px}.delete-dialog::backdrop{background:#11182788}.print-title{display:none}@media(max-width:760px){.school-options{grid-template-columns:1fr}.school-card{padding:24px}}@media print{.tabs,.form-section,.role-box,.login-wrap{display:none!important}.profile-layout{display:block}.print-title{display:block}.evaluation{break-inside:avoid}td{white-space:pre-wrap}}
</style></head><body>
<div id="loginView" class="login-wrap"><div class="card login-card"><div class="brand-badge">M</div><h1>MTSS</h1><p class="muted">Öğrenci Takip Sistemi</p><form id="loginForm"><div class="form-group"><label for="username">Kullanıcı adı</label><input class="input" id="username" autocomplete="username" required></div><div class="form-group"><label for="password">Şifre</label><input class="input" id="password" type="password" autocomplete="current-password" required></div><p id="loginError" class="login-error" role="alert"></p><button class="btn" type="submit">Düzenleyici olarak giriş yap</button><button id="guestButton" class="btn secondary" type="button">Misafir olarak gir</button></form><p class="muted small-note">Misafirler öğrenci profillerini ve formları kullanabilir. Görüşmeler yalnızca düzenleyiciye açıktır.</p></div></div>
<div id="schoolView" class="login-wrap" hidden><section class="card school-card"><div class="brand-badge">M</div><h1>Okul seçin</h1><p class="muted">Devam etmek istediğiniz okulu seçin.</p><div id="schoolOptions" class="school-options"></div><p id="schoolError" class="login-error" role="alert"></p><div class="school-actions"><button class="btn secondary" onclick="logout()">Çıkış yap</button></div></section></div>
