<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MTSS | Öğrenci Takip Sistemi</title><style>

    :root{
      --bg:#f4f7fb;
      --panel:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#3459d1;
      --primary-soft:#eef2ff;
      --success:#15803d;
      --danger:#b91c1c;
      --shadow:0 12px 30px rgba(15,23,42,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}
    .sidebar{
      background:#111827;
      color:#fff;
      padding:24px 18px;
      position:sticky;
      top:0;
      height:100vh;
    }
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}
    .brand-badge{
      width:42px;height:42px;border-radius:12px;background:#fff;color:#111827;
      display:grid;place-items:center;font-weight:800;
    }
    .brand h1{font-size:15px;margin:0;line-height:1.3}
    .brand span{font-size:12px;color:#9ca3af}
    .nav{display:grid;gap:8px}
    .nav button{
      width:100%;border:0;background:transparent;color:#d1d5db;
      text-align:left;padding:12px 14px;border-radius:12px;
    }
    .nav button:hover,.nav button.active{background:#1f2937;color:#fff}
    .sidebar-note{
      position:absolute;bottom:18px;left:18px;right:18px;
      padding:14px;border-radius:14px;background:#1f2937;color:#9ca3af;font-size:12px;line-height:1.5;
    }
    .main{padding:30px;min-width:0}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}
    .topbar h2{margin:0;font-size:28px}
    .topbar p{margin:6px 0 0;color:var(--muted)}
    .teacher-pill{background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:999px;font-size:13px}
    .grid{display:grid;gap:18px}
    .class-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .card{
      background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    .class-card{padding:20px;transition:.18s ease;cursor:pointer}
    .class-card:hover{transform:translateY(-2px);border-color:#c7d2fe}
    .class-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .class-icon{width:48px;height:48px;border-radius:14px;background:var(--primary-soft);display:grid;place-items:center;font-size:22px}
    .class-card h3{margin:14px 0 4px;font-size:18px}
    .class-card p{margin:0;color:var(--muted);font-size:14px}
    .count{font-size:12px;background:#f3f4f6;padding:6px 9px;border-radius:999px;color:#374151}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
    .input,.select,.textarea{
      width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--text);outline:none;
    }
    .input:focus,.select:focus,.textarea:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
    .search{max-width:360px}
    .btn{
      border:0;border-radius:12px;padding:11px 15px;font-weight:650;
      background:var(--primary);color:white;
    }
    .btn.secondary{background:white;color:var(--text);border:1px solid var(--line)}
    .btn.success{background:var(--success)}
    .btn.danger{background:var(--danger)}
    .students-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
    .student-card{padding:18px;cursor:pointer}
    .student-card:hover{border-color:#c7d2fe}
    .avatar{
      width:52px;height:52px;border-radius:50%;background:#eef2ff;color:#3730a3;
      display:grid;place-items:center;font-weight:800;font-size:17px;margin-bottom:12px;
    }
    .student-card h4{margin:0 0 4px}
    .student-card small{color:var(--muted)}
    .profile-layout{display:grid;grid-template-columns:320px 1fr;gap:20px}
    .profile-card{padding:22px;height:max-content}
    .profile-avatar{
      width:88px;height:88px;border-radius:24px;background:#eef2ff;color:#3730a3;
      display:grid;place-items:center;font-weight:800;font-size:28px;margin-bottom:18px;
    }
    .meta{display:grid;gap:10px;margin-top:18px}
    .meta-row{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;font-size:14px}
    .muted{color:var(--muted)}
    .section{padding:22px}
    .section h3{margin:0 0 16px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .form-group{display:grid;gap:7px}
    .form-group.full{grid-column:1/-1}
    .form-group label{font-size:13px;font-weight:650}
    .textarea{min-height:130px;resize:vertical}
    .evaluation-list{display:grid;gap:12px}
    .evaluation{
      border:1px solid var(--line);border-radius:14px;padding:14px;background:#fafafa;
    }
    .evaluation-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px}
    .evaluation-head strong{font-size:14px}
    .evaluation-head span{font-size:12px;color:var(--muted)}
    .evaluation p{margin:0;line-height:1.55}
    .empty{padding:24px;text-align:center;border:1px dashed #cbd5e1;border-radius:14px;color:var(--muted)}
    .table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}
    table{width:100%;border-collapse:collapse;min-width:900px}
    th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
    th{background:#f8fafc;color:#475569;position:sticky;top:0}
    tr:last-child td{border-bottom:0}
    .stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}
    .stat{padding:18px}
    .stat strong{font-size:27px;display:block;margin-bottom:3px}
    .stat span{color:var(--muted);font-size:13px}
    .back{display:inline-flex;align-items:center;gap:7px;margin-bottom:16px;color:#475569;background:transparent;border:0;padding:0}
    .toast{
      position:fixed;right:24px;bottom:24px;background:#111827;color:white;
      border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);display:none;z-index:30;
    }
    @media(max-width:1050px){
      .class-grid{grid-template-columns:repeat(2,1fr)}
      .students-grid{grid-template-columns:repeat(3,1fr)}
      .profile-layout{grid-template-columns:1fr}
      .stats{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:760px){
      .app{grid-template-columns:1fr}
      .sidebar{height:auto;position:relative;padding:16px}
      .sidebar-note{display:none}
      .nav{grid-template-columns:1fr 1fr}
      .main{padding:18px}
      .topbar{align-items:flex-start;flex-direction:column}
      .class-grid,.students-grid,.stats{grid-template-columns:1fr}
      .form-grid{grid-template-columns:1fr}
    }
    @media print{
      .sidebar,.topbar,.toolbar,.back,.btn{display:none!important}
      .app{display:block}
      .main{padding:0}
      body{background:white}
      .card,.table-wrap{box-shadow:none;border:0}
    }
  
[hidden]{display:none!important}button:focus-visible{outline:3px solid #818cf8;outline-offset:3px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top left,#dbe5ff,transparent 60%),#f4f7fb}.login-card{width:min(460px,100%);padding:36px}.login-card .brand-badge{background:#3459d1;color:white;margin-bottom:24px}.login-card h1{font-size:26px;margin:0 0 10px}.login-card p{line-height:1.6}.login-card form{display:grid;gap:18px;margin-top:26px}.login-card .btn{width:100%}.login-error{color:#b91c1c;min-height:22px;margin:0}.role-box{margin:24px 0;padding:14px;background:#1f2937;border-radius:12px;font-size:14px}.role-box button{margin-top:12px;width:100%}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{font-size:14px}.tabs button.active{background:#3459d1;color:white;border-color:#3459d1}.profile-content{min-width:0}.meta-row strong{text-align:right;overflow-wrap:anywhere}.evaluation p{white-space:pre-wrap;overflow-wrap:anywhere}.error-banner{padding:16px;background:#fff1f2;color:#991b1b;border-radius:12px;margin-bottom:16px}.class-card,.student-card{text-align:left;font:inherit;color:inherit}.small-note{font-size:13px;line-height:1.6}.section form .btn{justify-self:start}.profile-card h2{font-size:24px}.form-group label{font-size:14px}.section h3{line-height:1.5}.subtabs{margin-bottom:20px}.meeting-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.delete-dialog{border:0;border-radius:18px;box-shadow:var(--shadow);max-width:420px;padding:28px}.delete-dialog::backdrop{background:#11182788}.print-title{display:none}@media print{.tabs,.form-section,.role-box,.login-wrap{display:none!important}.profile-layout{display:block}.print-title{display:block}.evaluation{break-inside:avoid}td{white-space:pre-wrap}}
</style></head><body>
<div id="loginView" class="login-wrap"><div class="card login-card"><div class="brand-badge">M</div><h1>MTSS</h1><p class="muted">Öğrenci Takip Sistemi</p><form id="loginForm"><div class="form-group"><label for="username">Kullanıcı adı</label><input class="input" id="username" autocomplete="username" required></div><div class="form-group"><label for="password">Şifre</label><input class="input" id="password" type="password" autocomplete="current-password" required></div><p id="loginError" class="login-error" role="alert"></p><button class="btn" type="submit">Düzenleyici olarak giriş yap</button><button id="guestButton" class="btn secondary" type="button">Misafir olarak gir</button></form><p class="muted small-note">Misafirler öğrenci profillerini ve formları kullanabilir. Görüşmeler yalnızca düzenleyiciye açıktır.</p></div></div>
<div id="workspace" class="app" hidden><aside class="sidebar"><div class="brand"><div class="brand-badge">M</div><div><h1>MTSS</h1><span>Öğrenci Takip Sistemi</span></div></div><nav class="nav"><button id="navClasses" class="active" onclick="showClasses()">Sınıflar</button><button id="navEvaluations" onclick="showEvaluations()">Tüm Değerlendirmeler</button></nav><div class="role-box"><span id="roleLabel"></span><button class="btn secondary" onclick="logout()">Çıkış yap</button></div><div class="sidebar-note">2026–2027 eğitim öğretim yılı<br>6 sınıf · 60 örnek öğrenci</div></aside><main class="main"><div id="pageError" role="alert"></div><div id="appContent"></div></main></div>
<dialog id="deleteDialog" class="delete-dialog"><h3>Görüşme silinsin mi?</h3><p>Bu görüşme kaydı kalıcı olarak kaldırılacak.</p><div class="toolbar"><button class="btn secondary" onclick="document.getElementById('deleteDialog').close()">Vazgeç</button><button id="confirmDelete" class="btn danger">Görüşmeyi sil</button></div></dialog>
<div class="toast" id="toast" role="status"></div><script src="/app.js"></script></body></html>
